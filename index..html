<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #070412;
      color: #fff8eb;
      overflow: hidden;
    }
    .font-festive {
      font-family: 'Cinzel Decorative', serif;
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.7)); }
      50% { filter: drop-shadow(0 0 14px rgba(245, 158, 11, 1)); }
    }
    .glow-gold {
      animation: pulseGlow 2.4s infinite ease-in-out;
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-7px, -5px); }
      30% { transform: translate(7px, 4px); }
      45% { transform: translate(-5px, 6px); }
      60% { transform: translate(5px, -4px); }
      75% { transform: translate(-3px, 2px); }
    }
    .shake-active {
      animation: screenShake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    .cracker-card {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cracker-card:hover {
      transform: translateY(-3px);
    }
    .cracker-card.active-cracker {
      border-color: #fbbf24;
      background: linear-gradient(145deg, rgba(251, 191, 36, 0.24), rgba(217, 119, 6, 0.12));
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.35), inset 0 0 10px rgba(251, 191, 36, 0.2);
    }
    /* Custom subtle scrollbar for cracker dock */
    .custom-scroll::-webkit-scrollbar {
      height: 5px;
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(251, 191, 36, 0.35);
      border-radius: 9999px;
    }
  </style>
</head>

    // ==========================================
    // 2. SYNTHESIZED WEB AUDIO SOUND ENGINE
    // ==========================================
    class DiwaliAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.noiseBuffer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
            this.createNoiseBuffer();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      createNoiseBuffer() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2.0;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        this.noiseBuffer = buffer;
      }

      // Deep concussion boom (Sutli bomb, aerial shells)
      playBoom(intensity = 1.0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx || !this.noiseBuffer) return;

        const now = this.ctx.currentTime;

        // Sub-bass punch oscillator
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(130 * intensity, now);
        osc.frequency.exponentialRampToValueAtTime(24, now + 0.45 * intensity);

        oscGain.gain.setValueAtTime(Math.min(1, 0.85 * intensity), now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55 * intensity);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.56 * intensity);

        // Filtered explosion noise burst
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200 * intensity, now);
        filter.frequency.exponentialRampToValueAtTime(160, now + 0.75 * intensity);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(Math.min(1.0, 0.9 * intensity), now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8 * intensity);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 0.82 * intensity);
      }

      // Sharp crackle/pop for Ladi & sparklers
      playSnapPop(pitchFactor = 1.0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx || !this.noiseBuffer) return;

        const now = this.ctx.currentTime;
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime((1600 + Math.random() * 1200) * pitchFactor, now);
        filter.Q.setValueAtTime(1.8, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + 0.12);
      }

      // Rocket upward whistle
      playRocketWhistle(duration = 0.75) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        const startFreq = 580 + Math.random() * 180;
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(startFreq * 2.6, now + duration);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      // Fountain fizz / sizzle for Anar & Chakri
      playFountainSizzle(duration = 1.8) {
        if (this.muted) return;
        this.init();
        if (!this.ctx || !this.noiseBuffer) return;

        const now = this.ctx.currentTime;
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        noise.loop = true;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2400, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.15);
        gain.gain.setValueAtTime(0.14, now + duration * 0.75);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + duration + 0.05);
      }

      // Gentle chime for lighting a Diya / Lantern
      playChime() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.5];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.06);
          gain.gain.setValueAtTime(0.1, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + idx * 0.06 + 0.9);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.95);
        });
      }
    }

    const audio = new DiwaliAudioEngine();

    // ==========================================
    // 3. STATE & STAGE SETUP
    // ==========================================
    const canvas = document.getElementById('diwaliCanvas');
    const ctx = canvas.getContext('2d');
    const stageContainer = document.getElementById('stageContainer');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let groundY = height - 110;

    let selectedCrackerId = 'anar';
    let blastCount = 0;
    let autoShowActive = false;
    let autoShowTimer = 0;
    let backdropIndex = 0;
    const BACKDROPS = ['Palace Skyline', 'Ganga Ghat', 'Royal Courtyard'];

    // Collections for active simulation entities
    const stars = [];
    const particles = [];
    const shockwaves = [];
    const smokePuffs = [];
    const rockets = [];
    const anars = [];
    const chakris = [];
    const sutliBombs = [];
    const ladis = [];
    const sevenShots = [];
    const diyas = [];
    const skyLanterns = [];
    const floatingTexts = [];

    let pointerX = width * 0.5;
    let pointerY = height * 0.5;
    let pointerDown = false;
    let sparklerActiveTimer = 0;
    let screenFlashAlpha = 0;

    const FESTIVE_PALETTES = [
      ['#fde047', '#f59e0b', '#fb7185', '#ffffff'],
      ['#38bdf8', '#818cf8', '#f472b6', '#fef08a'],
      ['#4ade80', '#2dd4bf', '#fde047', '#ffffff'],
      ['#fb923c', '#ef4444', '#fde047', '#fef3c7'],
      ['#e879f9', '#c084fc', '#38bdf8', '#ffffff']
    ];

    function initStars() {
      stars.length = 0;
      const count = Math.floor((width * height) / 9000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * (height * 0.72),
          r: Math.random() * 1.6 + 0.4,
          alpha: Math.random() * 0.7 + 0.2,
          twinkleSpeed: Math.random() * 0.03 + 0.01,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function initDefaultDiyas() {
      diyas.length = 0;
      const step = Math.max(95, Math.floor(width / 9));
      for (let x = 60; x < width - 50; x += step) {
        diyas.push({
          x,
          y: groundY,
          flicker: Math.random() * Math.PI * 2,
          scale: 0.9
        });
      }
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      groundY = height - (width < 640 ? 128 : 118);
      initStars();
      // Reposition existing ground entities onto new groundY
      diyas.forEach(d => { d.y = groundY; });
      anars.forEach(a => { a.y = groundY; });
    }

    window.addEventListener('resize', resizeCanvas);

    // ==========================================
    // 4. UI RENDERING & CONTROLS
    // ==========================================
    const crackerTray = document.getElementById('crackerTray');
    const blastCounterEl = document.getElementById('blastCounter');
    const activeCrackerBadge = document.getElementById('activeCrackerBadge');
    const activeCrackerHint = document.getElementById('activeCrackerHint');
    const instantBlastCheckbox = document.getElementById('instantBlastCheckbox');

    function incrementBlastCount(amount = 1) {
      blastCount += amount;
      blastCounterEl.textContent = blastCount.toLocaleString();
    }

    function renderCrackerTray() {
      crackerTray.innerHTML = '';
      CRACKERS.forEach(cracker => {
        const isSelected = cracker.id === selectedCrackerId;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = cracker.id;
        btn.className = `cracker-card group relative flex flex-col items-center justify-between p-1.5 sm:p-2 rounded-xl border ${
          isSelected
            ? 'active-cracker border-amber-400'
            : 'border-white/10 bg-slate-900/75 hover:bg-slate-800/80 hover:border-amber-400/40'
        } text-center cursor-pointer focus:outline-none`;

        btn.innerHTML = `
          <span class="absolute top-1 left-1.5 text-[10px] font-bold px-1.5 py-0.2 rounded bg-black/50 text-amber-300/80 border border-amber-500/20 hidden sm:inline-block">${cracker.key}</span>

    function selectCracker(id) {
      selectedCrackerId = id;
      const cracker = CRACKERS.find(c => c.id === id);

    function triggerCrackerAtStageDefault(id) {
      const randX = width * (0.22 + Math.random() * 0.56);
      const skyY = height * (0.18 + Math.random() * 0.28);
      triggerCracker(id, randX, skyY);

    // ==========================================
    // 5. FIRECRACKER SPAWNERS & PHYSICS
    // ==========================================
    function addFloatingLabel(x, y, text, color = '#fde047') {
      floatingTexts.push({
        x,
        y,
        vy: -1.3,
        text,
        color,
        alpha: 1.0
      });
    }

    function triggerScreenShake() {
      stageContainer.classList.remove('shake-active');
      void stageContainer.offsetWidth;
      stageContainer.classList.add('shake-active');
    }

    function createAerialBurst(x, y, palette, particleCount = 95, speedScale = 1.0) {
      for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.15;
        const speed = (Math.random() * 5.5 + 1.8) * speedScale;
        const color = palette[Math.floor(Math.random() * palette.length)];
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.065,
          drag: 0.975,
          color,
          alpha: 1,
          decay: Math.random() * 0.014 + 0.01,
          size: Math.random() * 2.6 + 1.4,
          sparkle: Math.random() > 0.35,
          trail: []
        });
      }
      // Inner golden core ring
      for (let i = 0; i < 28; i++) {
        const angle = (Math.PI * 2 * i) / 28;
        const speed = 2.4 * speedScale;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.04,
          drag: 0.96,
          color: '#ffffff',
          alpha: 1,
          decay: 0.025,
          size: 2.0,
          sparkle: true,
          trail: []
        });
      }
      shockwaves.push({
        x,
        y,
        r: 4,
        maxR: 95 * speedScale,
        alpha: 0.75,
        color: palette[0]
      });
    }

    function triggerCracker(id, x, y) {
      audio.init();
      incrementBlastCount(1);

      if (id === 'anar') {
        const palette = FESTIVE_PALETTES[Math.floor(Math.random() * FESTIVE_PALETTES.length)];
        anars.push({
          x: Math.max(50, Math.min(width - 50, x)),
          y: groundY,
          life: 175,
          maxLife: 175,
          palette
        });
        audio.playFountainSizzle(2.6);
        addFloatingLabel(x, groundY - 40, '✨ Anar Lit!', '#fde047');

      } else if (id === 'chakri') {
        const targetY = Math.max(groundY - 35, Math.min(height - 95, y > groundY - 60 ? y : groundY - 12));
        chakris.push({
          x: Math.max(60, Math.min(width - 60, x)),
          y: targetY,
          vx: (Math.random() - 0.5) * 3.5,
          angle: 0,
          life: 165,
          maxLife: 165,
          hue: Math.floor(Math.random() * 360)
        });
        audio.playFountainSizzle(2.4);
        addFloatingLabel(x, targetY - 30, '🌀 Chakri Spinning!', '#34d399');

      } else if (id === 'rocket') {
        const launchX = Math.max(60, Math.min(width - 60, x));
        const targetY = Math.min(groundY - 140, Math.max(70, y < groundY - 100 ? y : height * (0.16 + Math.random() * 0.25)));
        const palette = FESTIVE_PALETTES[Math.floor(Math.random() * FESTIVE_PALETTES.length)];
        rockets.push({
          x: launchX,
          y: groundY,
          vx: (Math.random() - 0.5) * 1.4,
          vy: -(Math.random() * 3.5 + 9.5),
          targetY,
          palette,
          trail: []
        });
        audio.playRocketWhistle(0.7);
        addFloatingLabel(launchX, groundY - 35, '🚀 Rocket Away!', '#38bdf8');

      } else if (id === 'sutli') {
        const bombX = Math.max(60, Math.min(width - 60, x));
        const bombY = groundY - 6;
        sutliBombs.push({
          x: bombX,
          y: bombY,
          fuseTimer: 42, // ~0.7 sec tense fuse sizzle before massive blast
          maxFuse: 42
        });
        audio.playFountainSizzle(0.65);
        addFloatingLabel(bombX, bombY - 32, '💣 Fuse Lit...', '#fb7185');

      } else if (id === 'ladi') {
        const startX = Math.max(80, Math.min(width - 80, x));
        const baseY = groundY - 4;
        ladis.push({
          x: startX,
          y: baseY,
          popped: 0,
          totalPops: 28,
          timer: 0
        });
        addFloatingLabel(startX, baseY - 36, '🧨 1000 Wala Ladi!', '#f43f5e');

      } else if (id === 'phuljhari') {
        pointerX = x;
        pointerY = y;
        sparklerActiveTimer = 240; // 4 seconds of active sparkler burst
        audio.playFountainSizzle(2.2);
        emitSparklerBurst(x, y, 36);
        addFloatingLabel(x, y - 28, '✨ Wave Cursor to Sparkle!', '#fef08a');

      } else if (id === 'sevenshot') {
        const boxX = Math.max(70, Math.min(width - 70, x));
        sevenShots.push({
          x: boxX,
          y: groundY,
          shotsRemaining: 7,
          cooldown: 5
        });
        addFloatingLabel(boxX, groundY - 36, '🎆 7-Shot Sky Battery!', '#e879f9');

      } else if (id === 'diya') {
        const diyaX = Math.max(40, Math.min(width - 40, x));
        diyas.push({
          x: diyaX,
          y: groundY,
          flicker: Math.random() * Math.PI * 2,
          scale: 1.05
        });
        skyLanterns.push({
          x: diyaX,
          y: groundY - 24,
          vx: (Math.random() - 0.5) * 0.4,
          vy: -(0.55 + Math.random() * 0.45),
          wobble: Math.random() * Math.PI * 2
        });
        audio.playChime();
        addFloatingLabel(diyaX, groundY - 42, '🪔 Shubh Deepavali!', '#fbbf24');
      }
    }

    function emitSparklerBurst(x, y, count = 12) {
      const colors = ['#ffffff', '#fef08a', '#fde047', '#f59e0b', '#fb923c'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4.8 + 1.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          gravity: 0.08,
          drag: 0.94,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.04 + 0.025,
          size: Math.random() * 2.0 + 1.0,
          sparkle: true,
          trail: []
        });
      }
    }

    function detonateSutliBomb(b) {
      audio.playBoom(1.4);
      triggerScreenShake();
      screenFlashAlpha = 0.65;

      // Intense shockwave rings
      shockwaves.push({ x: b.x, y: b.y - 10, r: 8, maxR: 220, alpha: 0.95, color: '#fef08a' });
      shockwaves.push({ x: b.x, y: b.y - 10, r: 4, maxR: 150, alpha: 0.8, color: '#ef4444' });

      // Confetti & fiery debris
      const colors = ['#ffffff', '#fde047', '#f97316', '#ef4444', '#4ade80'];
      for (let i = 0; i < 130; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 11 + 2;
        particles.push({
          x: b.x,
          y: b.y - 12,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.0,
          gravity: 0.14,
          drag: 0.96,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.018 + 0.012,
          size: Math.random() * 3.2 + 1.5,
          sparkle: true,
          trail: []
        });
      }

      // Billowing smoke clouds
      for (let i = 0; i < 14; i++) {
        smokePuffs.push({
          x: b.x + (Math.random() - 0.5) * 45,
          y: b.y - 15 + (Math.random() - 0.5) * 20,
          vx: (Math.random() - 0.5) * 1.4,
          vy: -(Math.random() * 1.2 + 0.4),
          r: Math.random() * 18 + 14,
          alpha: 0.42
        });
      }

      addFloatingLabel(b.x, b.y - 55, '💥 DHAMAKA!', '#fef08a');
    }

    // ==========================================
    // 6. STAGE INPUT LISTENERS
    // ==========================================
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      pointerX = e.clientX - rect.left;
      pointerY = e.clientY - rect.top;
      pointerDown = true;
      triggerCracker(selectedCrackerId, pointerX, pointerY);
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      pointerX = e.clientX - rect.left;
      pointerY = e.clientY - rect.top;
      if (selectedCrackerId === 'phuljhari' && (pointerDown || sparklerActiveTimer > 0)) {
        emitSparklerBurst(pointerX, pointerY, 5);
        if (Math.random() < 0.25) audio.playSnapPop(1.4);
      }
    });

    window.addEventListener('pointerup', () => {
      pointerDown = false;
    });

    // Keyboard shortcuts (1-8 to choose cracker, Space to blast)
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const idx = parseInt(e.key, 10);
      if (idx >= 1 && idx <= CRACKERS.length) {
        const chosen = CRACKERS[idx - 1];
        selectCracker(chosen.id);
        triggerCrackerAtStageDefault(chosen.id);
      } else if (e.code === 'Space') {

        triggerCrackerAtStageDefault(selectedCrackerId);

    document.getElementById('clearStageBtn').addEventListener('click', () => {
      particles.length = 0;

      smokePuffs.length = 0;

    // Grand Finale ("Maha Dhamaka!")
    document.getElementById('finaleBtn').addEventListener('click', () => {
      audio.init();
      addFloatingLabel(width * 0.5, height * 0.28, '🎆 MAHA DIWALI FINALE! 🎆', '#fde047');

      // Spawn Anars on left and right
      triggerCracker('anar', width * 0.18, groundY);
      triggerCracker('anar', width * 0.82, groundY);

      // Spawn Chakris
      triggerCracker('chakri', width * 0.34, groundY - 12);
      triggerCracker('chakri', width * 0.66, groundY - 12);

      // Spawn a Ladi in the middle
      triggerCracker('ladi', width * 0.5, groundY - 8);

      // Launch a salvo of rockets & 7-shot battery
      triggerCracker('sevenshot', width * 0.5, groundY);
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          const rx = width * (0.15 + Math.random() * 0.7);

        }, i * 260);

    // ==========================================
    // 7. BACKDROP & SILHOUETTE RENDERER
    // ==========================================
    function drawBackdrop() {
      // Night sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
      if (backdropIndex === 0) {
        skyGrad.addColorStop(0, '#050214');
        skyGrad.addColorStop(0.55, '#130933');
        skyGrad.addColorStop(1, '#2e1042');
      } else if (backdropIndex === 1) {
        skyGrad.addColorStop(0, '#020817');
        skyGrad.addColorStop(0.6, '#0f172a');
        skyGrad.addColorStop(1, '#1e293b');
      } else {
        skyGrad.addColorStop(0, '#090314');
        skyGrad.addColorStop(0.6, '#240b36');
        skyGrad.addColorStop(1, '#451228');
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Twinkling stars
      stars.forEach(s => {
        s.phase += s.twinkleSpeed;
        const a = s.alpha * (0.6 + 0.4 * Math.sin(s.phase));
        ctx.fillStyle = `rgba(255, 248, 220, ${a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Architectural silhouette along horizon
      ctx.fillStyle = '#0c051a';
      ctx.beginPath();
      ctx.moveTo(0, groundY);

      if (backdropIndex === 0) {
        // Palace domes & minarets
        const segments = Math.max(5, Math.floor(width / 160));
        const segW = width / segments;
        for (let i = 0; i < segments; i++) {
          const sx = i * segW;
          ctx.lineTo(sx, groundY - 38);
          ctx.lineTo(sx + segW * 0.2, groundY - 38);
          ctx.quadraticCurveTo(sx + segW * 0.5, groundY - 95, sx + segW * 0.8, groundY - 38);
          ctx.lineTo(sx + segW, groundY - 38);
        }
      } else if (backdropIndex === 1) {
        // Varanasi Ghat steps & temple spires
        const steps = Math.max(4, Math.floor(width / 200));
        const sw = width / steps;
        for (let i = 0; i < steps; i++) {
          const sx = i * sw;
          ctx.lineTo(sx, groundY - 25);
          ctx.lineTo(sx + sw * 0.35, groundY - 25);
          ctx.lineTo(sx + sw * 0.5, groundY - 88);
          ctx.lineTo(sx + sw * 0.65, groundY - 25);
          ctx.lineTo(sx + sw, groundY - 25);
        }
      } else {
        // Royal Courtyard parapet jharokhas
        for (let x = 0; x < width; x += 48) {
          ctx.lineTo(x, groundY - 28);
          ctx.lineTo(x + 24, groundY - 40);
          ctx.lineTo(x + 48, groundY - 28);
        }
      }

      ctx.lineTo(width, groundY);
      ctx.closePath();
      ctx.fill();

      // Festive Marigold Garland (Toran) at top
      const swags = Math.max(6, Math.floor(width / 130));
      const swagW = width / swags;
      for (let i = 0; i < swags; i++) {
        const sx = i * swagW;
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(sx, 50);
        ctx.quadraticCurveTo(sx + swagW * 0.5, 78, sx + swagW, 50);
        ctx.stroke();
      }

      // Terrace floor
      const floorGrad = ctx.createLinearGradient(0, groundY, 0, height);
      floorGrad.addColorStop(0, '#1e0e2f');
      floorGrad.addColorStop(0.15, '#12071f');
      floorGrad.addColorStop(1, '#05020a');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, groundY, width, height - groundY);

      // Golden terrace border line
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(width, groundY);
      ctx.stroke();
    }

    // ==========================================
    // 8. MAIN ANIMATION & PHYSICS LOOP
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      drawBackdrop();

      // Auto Sky Show
      if (autoShowActive) {
        autoShowTimer++;
        if (autoShowTimer % 52 === 0) {
          const autoPool = ['rocket', 'anar', 'chakri', 'sevenshot'];
          const pick = autoPool[Math.floor(Math.random() * autoPool.length)];
          triggerCrackerAtStageDefault(pick);
        }
      }

      // 1. Update & Draw Sky Lanterns (Kandils)
      for (let i = skyLanterns.length - 1; i >= 0; i--) {
        const l = skyLanterns[i];
        l.wobble += 0.04;
        l.x += l.vx + Math.sin(l.wobble) * 0.25;
        l.y += l.vy;

        ctx.save();
        ctx.translate(l.x, l.y);
        const grad = ctx.createRadialGradient(0, 2, 2, 0, 0, 18);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.35, '#fde047');
        grad.addColorStop(0.75, 'rgba(249, 115, 22, 0.85)');
        grad.addColorStop(1, 'rgba(249, 115, 22, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ea580c';
        ctx.fillRect(-6, -9, 12, 16);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(-4, -6, 8, 10);
        ctx.restore();

        if (l.y < -40) skyLanterns.splice(i, 1);
      }

      // 2. Draw Diyas on Terrace
      diyas.forEach(d => {
        d.flicker += 0.14;
        const flameH = 10 + Math.sin(d.flicker) * 2.2;

        // Warm aura
        const glow = ctx.createRadialGradient(d.x, d.y - 8, 2, d.x, d.y - 8, 28);
        glow.addColorStop(0, 'rgba(253, 224, 71, 0.55)');
        glow.addColorStop(1, 'rgba(251, 146, 60, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(d.x, d.y - 8, 28, 0, Math.PI * 2);
        ctx.fill();

        // Clay base
        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.arc(d.x, d.y - 2, 11, 0, Math.PI);
        ctx.fill();

        // Flame
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.moveTo(d.x - 4, d.y - 3);
        ctx.quadraticCurveTo(d.x, d.y - 4 - flameH, d.x + 4, d.y - 3);
        ctx.closePath();
        ctx.fill();
      });

      // 3. Update & Draw Anars (Flower Pots)
      for (let i = anars.length - 1; i >= 0; i--) {
        const a = anars[i];
        a.life--;

        // Draw cone body
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.moveTo(a.x, a.y - 24);
        ctx.lineTo(a.x - 12, a.y);
        ctx.lineTo(a.x + 12, a.y);
        ctx.closePath();
        ctx.fill();

        // Erupt fountain sparks
        const intensity = Math.min(1, a.life / 35);
        for (let k = 0; k < 7; k++) {
          const spread = (Math.random() - 0.5) * 0.52;
          const speed = (Math.random() * 6.8 + 5.2) * (0.65 + 0.35 * intensity);
          const col = a.palette[Math.floor(Math.random() * a.palette.length)];
          particles.push({
            x: a.x + (Math.random() - 0.5) * 4,
            y: a.y - 24,
            vx: Math.sin(spread) * speed * 1.1,
            vy: -Math.cos(spread) * speed,
            gravity: 0.22,
            drag: 0.98,
            color: col,
            alpha: 1,
            decay: Math.random() * 0.02 + 0.014,
            size: Math.random() * 2.5 + 1.2,
            sparkle: true,
            trail: []
          });
        }

        if (a.life <= 0) anars.splice(i, 1);
      }

      // 4. Update & Draw Chakris (Ground Spinners)
      for (let i = chakris.length - 1; i >= 0; i--) {
        const c = chakris[i];
        c.life--;
        c.angle += 0.45;
        c.x += c.vx;
        if (c.x < 50 || c.x > width - 50) c.vx *= -1;
        c.vx += (Math.random() - 0.5) * 0.35;
        c.vx = Math.max(-4, Math.min(4, c.vx));

        // Emit spiral sparks from 4 jets
        for (let arm = 0; arm < 4; arm++) {
          const theta = c.angle + (arm * Math.PI) / 2;
          const speed = Math.random() * 3.8 + 3.2;
          const hue = (c.hue + c.life * 3 + arm * 45) % 360;
          particles.push({
            x: c.x + Math.cos(theta) * 8,
            y: c.y + Math.sin(theta) * 4,
            vx: Math.cos(theta) * speed,
            vy: Math.sin(theta) * speed * 0.55 - 0.8,
            gravity: 0.06,
            drag: 0.95,
            color: `hsl(${hue}, 95%, 65%)`,
            alpha: 1,
            decay: 0.032,
            size: 2.1,
            sparkle: true,
            trail: []
          });
        }

        // Draw spinning wheel center
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.angle);
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (c.life <= 0) chakris.splice(i, 1);
      }

      // 5. Update & Draw Sutli Bombs
      for (let i = sutliBombs.length - 1; i >= 0; i--) {
        const b = sutliBombs[i];
        b.fuseTimer--;

        // Draw green sutli bomb box
        ctx.fillStyle = '#15803d';
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 1.5;
        ctx.fillRect(b.x - 10, b.y - 16, 20, 16);
        ctx.strokeRect(b.x - 10, b.y - 16, 20, 16);

        // Burning fuse spark
        const fuseY = b.y - 16 - (b.fuseTimer / b.maxFuse) * 12;
        emitSparklerBurst(b.x, fuseY, 2);

        if (b.fuseTimer <= 0) {
          detonateSutliBomb(b);
          sutliBombs.splice(i, 1);
        }
      }

      // 6. Update & Draw 1000-Wala Ladi (Garland)
      for (let i = ladis.length - 1; i >= 0; i--) {
        const l = ladis[i];
        l.timer++;

        // Draw remaining red firecracker strip on ground
        const curX = l.x + (l.popped - l.totalPops * 0.5) * 5;
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(curX - 6, l.y - 6, 12, 6);

        if (l.timer % 3 === 0) {
          l.popped++;
          const popX = l.x + (Math.random() - 0.5) * 90;
          const popY = l.y - Math.random() * 18;
          audio.playSnapPop(0.9 + Math.random() * 0.5);

          // Flash & red paper shreds + sparks
          shockwaves.push({
            x: popX,
            y: popY,
            r: 2,
            maxR: 34,
            alpha: 0.7,
            color: '#fef08a'
          });

          const popColors = ['#fef08a', '#ef4444', '#f97316', '#ffffff'];
          for (let p = 0; p < 16; p++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = Math.random() * 5.5 + 1.5;
            particles.push({
              x: popX,
              y: popY,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - 1.5,
              gravity: 0.16,
              drag: 0.95,
              color: popColors[Math.floor(Math.random() * popColors.length)],
              alpha: 1,
              decay: 0.035,
              size: Math.random() * 2.4 + 1.2,
              sparkle: true,
              trail: []
            });
          }

          smokePuffs.push({
            x: popX,
            y: popY,
            vx: (Math.random() - 0.5) * 0.8,
            vy: -0.7,
            r: 10,
            alpha: 0.25
          });
        }

        if (l.popped >= l.totalPops) {
          ladis.splice(i, 1);
        }
      }

      // 7. Update & Draw 7-Shot Sky Battery
      for (let i = sevenShots.length - 1; i >= 0; i--) {
        const s = sevenShots[i];
        s.cooldown--;

        // Draw battery box
        ctx.fillStyle = '#86198f';
        ctx.strokeStyle = '#f0abfc';
        ctx.lineWidth = 1.5;
        ctx.fillRect(s.x - 14, s.y - 20, 28, 20);
        ctx.strokeRect(s.x - 14, s.y - 20, 28, 20);

        if (s.cooldown <= 0 && s.shotsRemaining > 0) {
          s.shotsRemaining--;
          s.cooldown = 26;
          const palette = FESTIVE_PALETTES[s.shotsRemaining % FESTIVE_PALETTES.length];
          rockets.push({
            x: s.x + (Math.random() - 0.5) * 10,
            y: s.y - 20,
            vx: (Math.random() - 0.5) * 2.2,
            vy: -(Math.random() * 2.8 + 9.2),
            targetY: height * (0.14 + Math.random() * 0.28),
            palette,
            trail: []
          });
          audio.playRocketWhistle(0.55);
        }

        if (s.shotsRemaining <= 0) {
          sevenShots.splice(i, 1);
        }
      }

      // 8. Update & Draw Ascending Sky Rockets
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.x += r.vx;
        r.y += r.vy;
        r.vy += 0.09; // Gravity on rocket

        // Emit golden tail sparks
        for (let t = 0; t < 3; t++) {
          particles.push({
            x: r.x + (Math.random() - 0.5) * 3,
            y: r.y + 4,
            vx: (Math.random() - 0.5) * 1.2,
            vy: Math.random() * 2.2 + 0.5,
            gravity: 0.05,
            drag: 0.95,
            color: '#fde047',
            alpha: 0.9,
            decay: 0.045,
            size: 1.8,
            sparkle: false,
            trail: []
          });
        }

        // Draw rocket head
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
        ctx.fill();

        if (r.y <= r.targetY || r.vy >= -1.0) {
          audio.playBoom(0.95);
          createAerialBurst(r.x, r.y, r.palette, 95, 1.05);
          rockets.splice(i, 1);
        }
      }

      // 9. Active Phuljhari (Sparkler) on Cursor / Stage
      if (selectedCrackerId === 'phuljhari' || sparklerActiveTimer > 0) {
        if (sparklerActiveTimer > 0) sparklerActiveTimer--;
        emitSparklerBurst(pointerX, pointerY, 3);

        // Draw sparkler stick held at pointer
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(pointerX, pointerY);
        ctx.lineTo(pointerX + 22, pointerY + 28);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pointerX, pointerY, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // 10. Update & Draw Smoke Puffs
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        const s = smokePuffs[i];
        s.x += s.vx;
        s.y += s.vy;
        s.r += 0.35;
        s.alpha -= 0.006;

        if (s.alpha <= 0) {
          smokePuffs.splice(i, 1);
          continue;
        }

        ctx.fillStyle = `rgba(180, 175, 195, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 11. Update & Draw Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.18 + 2.5;
        sw.alpha -= 0.038;

        if (sw.alpha <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 12. Update & Draw Firework Particles
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > 4) p.trail.shift();

        p.vx *= p.drag;
        p.vy *= p.drag;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        // Bounce sparks off terrace ground
        if (p.y >= groundY && p.vy > 0) {
          p.y = groundY;
          p.vy *= -0.45;
          p.vx *= 0.75;
        }

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const flickerAlpha = p.sparkle && Math.random() < 0.25 ? p.alpha * 0.35 : p.alpha;
        ctx.globalAlpha = Math.max(0, flickerAlpha);

        if (p.trail.length > 1) {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.size * 0.85;
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for (let t = 1; t < p.trail.length; t++) {
            ctx.lineTo(p.trail[t].x, p.trail[t].y);
          }
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 13. Floating Festive Labels
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.018;
        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.font = 'bold 13px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // 14. Screen Flash Effect (Sutli Bomb)
      if (screenFlashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 250, 220, ${screenFlashAlpha})`;
        ctx.fillRect(0, 0, width, height);
        screenFlashAlpha = Math.max(0, screenFlashAlpha - 0.06);
      }
    }

    // ==========================================
    // 9. BOOTSTRAP ON LOAD
    // ==========================================
    window.onload = () => {
      resizeCanvas();
      initDefaultDiyas();
      renderCrackerTray();
      animate();

      // Welcome celebratory burst on load (visual only until user clicks for audio)
      setTimeout(() => {
        createAerialBurst(width * 0.35, height * 0.25, FESTIVE_PALETTES[0], 75, 0.9);
        createAerialBurst(width * 0.65, height * 0.22, FESTIVE_PALETTES[1], 75, 0.9);
      }, 250);
    };
  </script>
</body>
